plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bezza.embedhost'
    compileSdk 34

    defaultConfig {
        applicationId "com.bezza.embedhost"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.window:window:1.3.0'
}
